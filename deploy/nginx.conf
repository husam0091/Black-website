worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # Redirect only client requests, never internal extensionless rewrites.
        if ($request_uri ~ "^/(.*)/index\\.html(?:\\?|$)") { return 308 /$1/$is_args$args; }
        if ($request_uri ~ "^/index\\.html(?:\\?|$)") { return 308 /$is_args$args; }
        if ($request_uri ~ "^/(.+)\\.html(?:\\?|$)") { return 308 /$1$is_args$args; }
        autoindex off;
        client_max_body_size 16k;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Inline styles support existing hero imagery; executable inline scripts are blocked.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        # Static pages only; extensionless routes internally resolve to HTML.
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ @html_page;
        }
        location @html_page { rewrite ^/(.+)$ /$1.html last; }
        location ~ \.html$ {
            expires -1;
            limit_except GET { deny all; }
            default_type text/html;
            try_files $uri =404;
        }
        location ~* \.(?:js|css)$ { expires -1; try_files $uri =404; }
        # These are deployment/source files, never public website assets.
        location ~ /\.(?!well-known/) { return 404; }
        location ~* \.(?:map|env|ini|log|sql|bak|old|orig|swp|py|sh|ya?ml|toml)$ { return 404; }
        location ~* \.(webp|png|jpe?g|svg|ttf|woff2?|pdf)$ {
            try_files $uri =404;
            expires 7d;
        }
    }
}
